name: Build and deploy apps on Cloudflare

# Builds the apps that run on Cloudflare Workers (OpenNext) and deploys each
# one whose build would differ from what is live: the marketing site (web),
# the workspace (application), accounts (auth), admin and the merchant sites
# (sites). The API deploys on its own (deploy-api.yml).
#
#   push to development   -> the dev Workers (saroh-*-dev, *.saroh.io)
#   push to main          -> the production Workers (saroh-*, *.saroh.in, saroh.app)
#   every night 00:00 IST -> the marketing site, both environments, so a page
#                            dated today appears (the site is static)
#   manual / the API      -> one app (or all) in one environment, always
#                            deployed; the API starts the marketing site's build
#                            when pricing is published
#
# What deploys (scripts/cf-plan.mjs): every deploy labels its Worker with the
# app's build fingerprint (BUILD_FINGERPRINT, Turbo's hash of what the build
# reads; tests and docs aren't part of it). A push deploys only the apps whose
# fingerprint differs from the live one, so a test, a doc or another app's
# change deploys nothing, and a deploy that failed is tried again next push.
#
# Settings that aren't secret live in each app's wrangler.jsonc and are used
# for the build too (scripts/cf-env.mjs). Secrets live in the GitHub
# environments `cloudflare-development` and `cloudflare-production`: they are
# passed to the build and copied onto the Worker on every deploy, and never
# printed (the repo, and so this log, is public).

on:
    push:
        branches: [main, development]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    schedule:
        # 18:30 UTC is 00:00 IST.
        - cron: "30 18 * * *"
    workflow_dispatch:
        inputs:
            app:
                description: Which app
                type: choice
                options: [web, application, auth, admin, sites, all]
                default: web
            environment:
                description: Where
                type: choice
                options: [development, production]
                default: development

concurrency:
    # One plan at a time per branch; a newer push waits rather than racing.
    group: cloudflare-plan-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    plan:
        name: What to deploy
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
        env:
            # Read-only use here: the live Workers' fingerprints.
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITES_DEPLOY_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
            - uses: ./.github/actions/setup
              with:
                  prisma: "false"
            - id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.ref_name }}
                  INPUT_APP: ${{ inputs.app }}
                  INPUT_ENV: ${{ inputs.environment }}
              run: |
                  set -euo pipefail
                  ref_of() { [ "$1" = production ] && echo main || echo development; }
                  with_ref() { jq -c --arg r "$(ref_of "$1")" 'map(. + {ref: $r})'; }
                  case "$EVENT" in
                    schedule)
                      # Same fingerprint as yesterday, but today's date: always build.
                      prod=$(FORCE=1 node scripts/cf-plan.mjs production web | with_ref production)
                      dev=$(FORCE=1 node scripts/cf-plan.mjs development web | with_ref development)
                      json=$(jq -c -n --argjson a "$prod" --argjson b "$dev" '$a + $b') ;;
                    workflow_dispatch)
                      only=$([ "$INPUT_APP" = all ] && echo "" || echo "$INPUT_APP")
                      json=$(FORCE=1 node scripts/cf-plan.mjs "$INPUT_ENV" "$only" | with_ref "$INPUT_ENV") ;;
                    push)
                      env=$([ "$REF" = main ] && echo production || echo development)
                      json=$(node scripts/cf-plan.mjs "$env" | jq -c --arg r "$REF" 'map(. + {ref: $r})') ;;
                  esac
                  echo "matrix=$json" >> "$GITHUB_OUTPUT"
                  echo "To deploy: $json"

    deploy:
        name: Deploy ${{ matrix.pkg }} (${{ matrix.env }})
        needs: plan
        if: needs.plan.outputs.matrix != '[]'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        environment: cloudflare-${{ matrix.env }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.plan.outputs.matrix) }}
        concurrency:
            group: deploy-cloudflare-${{ matrix.pkg }}-${{ matrix.env }}
            cancel-in-progress: false
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITES_DEPLOY_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            NEXT_TELEMETRY_DISABLED: "1"
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.ref }}

            - uses: ./.github/actions/setup
              with:
                  prisma: "false"

            - name: Settings from wrangler.jsonc
              run: node scripts/cf-env.mjs "${{ matrix.dir }}" "${{ matrix.env }}" >> "$GITHUB_ENV"

            # Secrets for the build and the Worker. A gated dev app without its
            # access key would be open to anyone, so its deploy stops here.
            - name: Secrets
              env:
                  DEV_ACCESS_KEY: ${{ secrets.DEV_ACCESS_KEY }}
                  SITE_RELAY_SECRET: ${{ secrets.SITE_RELAY_SECRET }}
              run: |
                  set -euo pipefail
                  names=()
                  # The merchant sites are public by design; every other dev app is gated.
                  if [ "${{ matrix.env }}" = development ] && [ "${{ matrix.pkg }}" != sites ]; then
                    [ -n "$DEV_ACCESS_KEY" ] || { echo "::error::DEV_ACCESS_KEY is missing: a dev app would be public"; exit 1; }
                    names+=(DEV_ACCESS_KEY)
                  fi
                  if [ "${{ matrix.pkg }}" = web ] || [ "${{ matrix.pkg }}" = sites ]; then
                    [ -n "$SITE_RELAY_SECRET" ] || { echo "::error::SITE_RELAY_SECRET is missing"; exit 1; }
                    names+=(SITE_RELAY_SECRET)
                  fi
                  json='{}'
                  for n in "${names[@]:-}"; do
                    [ -n "$n" ] || continue
                    echo "$n=${!n}" >> "$GITHUB_ENV"
                    json=$(jq -c --arg k "$n" --arg v "${!n}" '. + {($k): $v}' <<<"$json")
                  done
                  umask 077
                  printf '%s' "$json" > "$RUNNER_TEMP/worker-secrets.json"
                  echo "Secrets for the Worker: ${names[*]:-none}"

            - name: Build the packages the app uses
              run: pnpm turbo run build --filter='${{ matrix.pkg }}^...'

            - name: Build for Cloudflare
              working-directory: ${{ matrix.dir }}
              run: pnpm cf:build

            - name: Secrets onto the Worker
              working-directory: ${{ matrix.dir }}
              run: |
                  set -euo pipefail
                  if [ "$(cat "$RUNNER_TEMP/worker-secrets.json")" != "{}" ]; then
                    pnpm exec wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json" \
                      ${{ matrix.env == 'production' && '--env production' || '' }} > /dev/null
                  fi
                  rm -f "$RUNNER_TEMP/worker-secrets.json"

            # OpenNext's deploy, not wrangler's: it first copies the prebuilt
            # pages into the Worker's static files. The fingerprint label is how
            # the next plan knows this build is live.
            - name: Deploy
              working-directory: ${{ matrix.dir }}
              run: >-
                  pnpm exec opennextjs-cloudflare deploy
                  ${{ matrix.env == 'production' && '--env production' || '' }}
                  --var BUILD_FINGERPRINT:${{ matrix.fingerprint }}

            # A deploy recreates the routes in wrangler.jsonc "fail closed";
            # Wrangler can't say otherwise. Set them to fail open, so a failing
            # Worker falls through to the origin instead of an error page. Only
            # warns: the deploy itself has already succeeded.
            - name: Routes fail open
              continue-on-error: true
              run: |
                  set -euo pipefail
                  api=https://api.cloudflare.com/client/v4
                  auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
                  node scripts/cf-env.mjs --routes "${{ matrix.dir }}" "${{ matrix.env }}" | while read -r zone pattern; do
                    zone_id=$(curl -fsS "${auth[@]}" "$api/zones?name=$zone" | jq -r '.result[0].id')
                    route=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/workers/routes" | jq -c --arg p "$pattern" '.result[] | select(.pattern == $p)')
                    [ -n "$route" ] || { echo "::warning::no route $pattern on $zone"; continue; }
                    id=$(jq -r .id <<<"$route")
                    body=$(jq -c '{pattern, script, request_limit_fail_open: true}' <<<"$route")
                    curl -fsS -X PUT "${auth[@]}" "$api/zones/$zone_id/workers/routes/$id" -d "$body" > /dev/null
                    echo "fail open: $pattern"
                  done
