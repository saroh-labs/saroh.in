name: Build and deploy API

# Builds apps/api.saroh.in, pushes it to GHCR, then rolls it out.
#
# The build happens here rather than on the deployment host: that box also runs
# the database, and a pnpm install plus turbo build across the workspace would
# evict Postgres's page cache for the duration. The host only ever pulls.
#
# The rollout (backup, migrate, deploy, wait for readiness) lives on the host,
# not in this public repo. CI's key is restricted to that one command, so the
# only thing this workflow can do there is name the image tag to ship. Where the
# host is, and its pinned host key, come from repository secrets.
#
# Which environment is decided here, and enforced there by which key is used:
#   push to main         -> production   (VPS_SSH_KEY)
#   push to development  -> development  (VPS_DEV_SSH_KEY, which cannot reach production)
#   manual run           -> the `target` input, development unless you pick production

on:
    push:
        branches: [main, development]
        # Skip the build for changes that cannot affect the image. The api's own
        # tree, everything it imports, and the build inputs are all covered.
        paths:
            - "apps/api.saroh.in/**"
            - "packages/**"
            - "tooling/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "package.json"
            - "turbo.json"
            - ".dockerignore"
            - ".github/workflows/deploy-api.yml"
    # Manual trigger, for redeploying an unchanged tree or building off a branch
    # (a production rollout of `development` ahead of the merge to main).
    workflow_dispatch:
        inputs:
            target:
                description: Where to deploy the build
                type: choice
                options: [development, production]
                default: development

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/saroh-api

concurrency:
    # Never let two builds race to move the `latest` tag, and never cancel a
    # run mid-deploy: a killed ssh session could stop between migrate and deploy.
    group: build-api-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Required to push to GHCR with the automatic GITHUB_TOKEN. Nothing
            # else is granted; this job never writes to the repo.
            packages: write

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Derive tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  # A moving `latest` plus an immutable `sha-<commit>`. The deploy
                  # pins the SHA tag, which is what makes rollback a matter of
                  # naming the previous one rather than rebuilding it.
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=long

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api.saroh.in/Dockerfile
                  push: true
                  # linux/amd64 only. The VM is x86_64 and so is this runner, so
                  # this builds natively. Adding arm64 would pull in QEMU
                  # emulation and roughly quadruple the build time for a
                  # platform nothing runs.
                  platforms: linux/amd64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Registry-backed layer cache. The expensive layer is
                  # `pnpm install`, and it only invalidates when a manifest or
                  # the lockfile changes — so a typical code-only commit reuses
                  # it and the build is a couple of minutes.
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
                  provenance: false

            - name: Summary
              run: |
                  {
                    echo "### API image pushed"
                    echo
                    echo '```'
                    echo "${{ steps.meta.outputs.tags }}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: none
        env:
            TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
        # One rollout per environment at a time, across every ref.
        concurrency:
            group: deploy-api-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
            cancel-in-progress: false

        steps:
            - name: Deploy
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  # The key decides the environment on the host; the dev key is
                  # forced to the development target and cannot deploy production.
                  VPS_SSH_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development')) == 'production' && secrets.VPS_SSH_KEY || secrets.VPS_DEV_SSH_KEY }}
                  VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
                  # Full 40 characters, matching `type=sha,format=long` above.
                  TAG: sha-${{ github.sha }}
              run: |
                  set -euo pipefail
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$VPS_SSH_KEY" | install -m 600 /dev/stdin ~/.ssh/deploy
                  printf '%s\n' "$VPS_KNOWN_HOSTS" | install -m 600 /dev/stdin ~/.ssh/known_hosts
                  # StrictHostKeyChecking=yes against the pinned key: refuse a
                  # host we do not recognise rather than trust it on first use.
                  ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                      -o ServerAliveInterval=30 \
                      "root@${VPS_HOST}" "$TAG"
                  echo "### Deployed \`$TAG\` to $TARGET" >> "$GITHUB_STEP_SUMMARY"
