name: CI

# Gates every PR (and pushes to the long-lived branches) on the same checks a
# developer runs locally: lint, typecheck, unit tests, build, integration tests
# (plain and under RLS), the migration replay and the browser suites. See
# ticket S0-002. The independent gates run as parallel jobs and the slow suites
# are sharded, and a run checks only what its change can reach (the `changes`
# job); `ci` and `browser-e2e` gather them under the check names the
# branch rules and the PR page already use. Shared setup is
# .github/actions/setup.
#
# NOTE FOR REPO ADMINS: this workflow only *runs* the gates. To make them
# blocking, mark the `ci` and `browser-e2e` jobs as REQUIRED status checks in the branch
# protection rules for `main` and `development` (Settings → Branches). That
# cannot be configured from a workflow file.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  # Everything, regardless of what changed: by hand from the Actions tab, and
  # weekly as a safety net for anything the path rules below might miss.
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0" # Sunday 20:30 UTC (Monday 02:00 IST)

# Least privilege: the gates only read the checked-out tree. No job needs to
# write to the repo, packages, or deployments, so we grant read-only at the top
# level and do not elevate anywhere.
permissions:
  contents: read

# Cancel superseded runs on an open PR (a new commit or a force-push) so CI does
# not pile up on stale commits. Never on main or development: each push there
# is checked against the commit before it, so a cancelled run would leave that
# push's own changes unchecked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gates used to run as one job, one step after another: lint, typecheck,
  # unit tests, build, then the integration suite twice (plain and under RLS),
  # about 18 minutes end to end. They are independent, so they now run side by
  # side: static checks, unit tests and the build each in their own job, and
  # the integration suite split into 4 shards per mode, each against its own
  # Postgres.
  # `ci` at the end waits for all of them and keeps the old check's name, so a
  # branch rule that requires "Lint, typecheck, test & build" still means
  # every one of these passed.

  # What this change touches, so a run checks only what it can reach. The
  # base is the PR's merge base, or on a push the commit the branch pointed
  # at before it (a merged PR is then exactly that PR's diff):
  #   - a change to CI, the root manifests, the lockfile or tooling/ runs
  #     everything (it can affect any package);
  #   - otherwise each gate runs when a path it depends on changed, and lint,
  #     typecheck, unit tests and build cover only the packages that changed
  #     plus everything that depends on them (turbo's `...[base]` filter).
  # A manual or scheduled run, a new branch, or a push whose previous commit
  # is gone (a force-push) checks everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scan.outputs.full }}
      code: ${{ steps.scan.outputs.code }}
      api: ${{ steps.scan.outputs.api }}
      db: ${{ steps.scan.outputs.db }}
      e2e: ${{ steps.scan.outputs.e2e }}
      base: ${{ steps.scan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Written to the step's outputs only; nothing is printed to the log.
          put() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          everything() { for k in full code api db e2e; do put "$k" true; done; put base ""; exit 0; }
          case "$EVENT" in
            pull_request) base=$(git merge-base "$PR_BASE" HEAD) ;;
            push)
              # All zeros on a new branch; missing after a force-push.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then everything; fi
              base="$PUSH_BEFORE" ;;
            *) everything ;;
          esac
          put base "$base"
          # Anything but docs and Markdown counts as code, and only code decides
          # which gates run: an app's AGENTS.md or README used to start the
          # integration shards and both browser suites, none of which reads it.
          # (The diff on its own line, so a failing diff still fails the job
          # instead of reading as "nothing changed".)
          all=$(git diff --name-only "$base" HEAD)
          files=$(printf '%s\n' "$all" | grep -vE '^(docs/|.*\.md$)' || true)
          has() { printf '%s\n' "$files" | grep -qE "$1"; }
          if has '^(\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.nvmrc$|tooling/)'; then
            everything
          fi
          put full false
          if [ -n "$files" ]; then put code true; else put code false; fi
          if has '^(apps/api\.saroh\.in/|packages/)'; then put api true; else put api false; fi
          if has '^packages/database/'; then put db true; else put db false; fi
          if has '^(apps/|packages/|e2e/|scripts/)'; then put e2e true; else put e2e false; fi

  static:
    name: Lint, typecheck and repo checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Placeholder build/runtime env. The apps validate env at build time via the
    # S0-006 typed env modules; SKIP_ENV_VALIDATION short-circuits that zod check
    # (t3-env's recommended CI/Docker pattern) so no build/test step can fail on a
    # required var, while the dummy values below keep any code that reads env
    # working. None of them point at a live service, and no real secret is used.
    #
    # DATABASE_URL is deliberately a DIFFERENT database name ("saroh_ci_dummy")
    # from the integration TEST_DATABASE_URL ("saroh_test") so the S0-003
    # non-test-DB guard (which rejects TEST_DATABASE_URL == DATABASE_URL, by
    # string or by host+db) is satisfied. Nothing ever connects to this URL.
    env:
      # On a PR, only the packages the change touched and their dependents.
      AFFECTED: ${{ needs.changes.outputs.full != 'true' && format('--filter=...[{0}]', needs.changes.outputs.base) || '' }}
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_ci_dummy
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters # gitleaks:allow (CI placeholder, no live service)
      BETTER_AUTH_URL: http://localhost:3333
      APP_URL: http://localhost:3003
      CORS_ORIGIN: http://localhost:3000
      EMAIL_FROM: Saroh <noreply@saroh.in>
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3333
      NEXT_PUBLIC_ROOT_DOMAIN: saroh.app
      NEXT_PUBLIC_APP_DOMAIN: app.saroh.in
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: static

      # One turbo run, so lint and typecheck share the task graph and run in
      # parallel across packages. Package-boundary enforcement (frontends must
      # not import Prisma directly) is part of `lint` via the shared nextjs
      # ESLint config.
      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck $AFFECTED

      # Circular-dependency detection across all workspaces.
      - name: Circular dependency check
        run: pnpm run check:cycles

      # Every destination the API emits and every static in-app link must
      # resolve to a real route. Three shipped hrefs (/payments,
      # /communications, /stores) 404'd for merchants before this existed.
      - name: Route destination check
        run: pnpm run check:routes

      # Merchant sites render off the --site-* layer only, and there is exactly
      # one renderer — gates G2 and G6 (#252).
      - name: Site blocks gate
        run: pnpm run check:blocks

      # Every browser spec names what it exercises (`// @covers …`), so the
      # local gate can run only the specs a batch reaches. CI still runs all.
      - name: Browser spec coverage keys
        run: pnpm run check:e2e-covers

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # On a PR, only the packages the change touched and their dependents.
      AFFECTED: ${{ needs.changes.outputs.full != 'true' && format('--filter=...[{0}]', needs.changes.outputs.base) || '' }}
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_ci_dummy
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters # gitleaks:allow (CI placeholder, no live service)
      BETTER_AUTH_URL: http://localhost:3333
      APP_URL: http://localhost:3003
      CORS_ORIGIN: http://localhost:3000
      EMAIL_FROM: Saroh <noreply@saroh.in>
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3333
      NEXT_PUBLIC_ROOT_DOMAIN: saroh.app
      NEXT_PUBLIC_APP_DOMAIN: app.saroh.in
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: unit

      # The api's specs import its workspace packages (auth, block-contract,
      # …) as built; the single job used to have them from typecheck.
      - name: Build what the api imports
        if: needs.changes.outputs.api == 'true'
        run: pnpm turbo run build --filter=@saroh/api^...

      - name: Unit tests (api, no database)
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @saroh/api test:unit

      # Everything else with a `test` script: the packages and the workspace
      # app (#287). `@saroh/api` is excluded: its bare `test` script is `jest`,
      # which picks up the integration specs that need a database.
      - name: Unit tests (packages and the app)
        run: pnpm turbo run test --filter='!@saroh/api' $AFFECTED

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # On a PR, only the packages the change touched and their dependents.
      AFFECTED: ${{ needs.changes.outputs.full != 'true' && format('--filter=...[{0}]', needs.changes.outputs.base) || '' }}
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_ci_dummy
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters # gitleaks:allow (CI placeholder, no live service)
      BETTER_AUTH_URL: http://localhost:3333
      APP_URL: http://localhost:3003
      CORS_ORIGIN: http://localhost:3000
      EMAIL_FROM: Saroh <noreply@saroh.in>
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3333
      NEXT_PUBLIC_ROOT_DOMAIN: saroh.app
      NEXT_PUBLIC_APP_DOMAIN: app.saroh.in
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: build
          next-cache: "true"

      - name: Build
        run: pnpm turbo run build $AFFECTED

      # Tolerant of the registry being unreachable: the audit endpoint timed
      # out from the runner on two consecutive runs in one morning. A CRITICAL
      # FINDING still fails the job; failing to reach the registry is retried,
      # then reported as a warning so the next run tries again. Highs and
      # moderates (mostly transitive dev tooling) are triaged in the
      # dependency-refresh pass, not blocked here.
      - name: Dependency audit (critical only)
        run: |
          for attempt in 1 2 3; do
            if out=$(pnpm audit --audit-level critical 2>&1); then
              printf '%s\n' "$out"
              exit 0
            fi
            if ! printf '%s' "$out" | grep -qE 'ERR_SOCKET_TIMEOUT|ETIMEDOUT|ECONNRESET|ENOTFOUND|FetchError'; then
              printf '%s\n' "$out"
              exit 1
            fi
            echo "Registry unreachable (attempt $attempt of 3)."
            sleep 30
          done
          echo "::warning::Dependency audit skipped: registry unreachable after 3 attempts"

  # The integration suite runs serially (maxWorkers 1: the between-suite
  # TRUNCATE is only race-free on one connection), so the way to make it
  # faster is to split the specs across jobs, each with its own Postgres.
  # Every spec still runs, in both modes:
  #   plain — the schema from `prisma db push`, the service's own connection;
  #   rls   — the way production runs once RLS is switched on (#53): the
  #           schema from the migrations (where the policies live), a
  #           NOBYPASSRLS role with DML rights only, RLS_ENFORCEMENT=on, and
  #           every service call made inside its RLS context
  #           (apps/api.saroh.in/test/rls-mode.ts).
  integration:
    name: Integration (${{ matrix.mode }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, rls]
        shard: [1, 2, 3, 4]
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_ci_dummy
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters # gitleaks:allow (CI placeholder, no live service)
      BETTER_AUTH_URL: http://localhost:3333
      APP_URL: http://localhost:3003
      CORS_ORIGIN: http://localhost:3000
      EMAIL_FROM: Saroh <noreply@saroh.in>
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3333
      NEXT_PUBLIC_ROOT_DOMAIN: saroh.app
      NEXT_PUBLIC_APP_DOMAIN: app.saroh.in
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_test
      TEST_RLS: ${{ matrix.mode == 'rls' && 'on' || '' }}
    # The test DB name contains "test" so it passes the S0-003 guard.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saroh_test
        ports:
          - 5432:5432
        # Polled every 2s rather than 10s: the job waits for the first healthy
        # answer, and at 10s that was a fixed ~10s on every database job. Over
        # TCP (-h), because the image's init runs a temporary server on the
        # socket only and restarts it; a socket check could pass on that one.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # The globalSetup runs `prisma db push` in packages/database, which needs
      # the client generated here and pnpm on PATH. The suite itself runs
      # through jest directly, so the only Turbo work is the build below, and
      # the shards READ the unit job's cache for it (same packages, same env,
      # so the same hashes) without writing one of their own.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: unit
          turbo-save: "false"

      # The api's workspace dependencies (auth, block-contract, …) are consumed
      # built, as `pnpm run build` would leave them.
      - name: Build what the api imports
        run: pnpm turbo run build --filter=@saroh/api^...

      - name: Integration tests
        working-directory: apps/api.saroh.in
        run: pnpm exec jest -c jest.integration.config.js --shard=${{ matrix.shard }}/4

  # Keeps the name branch rules and the PR page already know, and passes only
  # when every job above passed. A skipped or cancelled job counts as a fail.
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    needs: [changes, static, unit, build, integration]
    if: always()
    steps:
      # A job skipped because the change can't reach it is fine; one that
      # failed or was cancelled is not, and neither is `changes` itself not
      # succeeding (its skip would otherwise wave everything through).
      - name: Every gate that ran passed
        env:
          CHANGES: ${{ needs.changes.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          [ "$CHANGES" = "success" ] && [ "$FAILED" != "true" ]

  # The migration history is not exercised anywhere else in this workflow: the
  # integration suite builds its database with `prisma db push`, which reads
  # schema.prisma directly and never executes a migration file. So a migration
  # that cannot replay, or that disagrees with the datamodel, passes every other
  # gate here. Both have shipped (#146, and the booking-outcome index) — the
  # first made it impossible to provision a new environment at all.
  #
  # This job builds a database the way a new environment does: empty, then the
  # whole chain in order, then a diff against schema.prisma that must be empty.
  migration-replay:
    name: Migration replay from empty
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'

    # Its own throwaway database, created empty by the image. The name is not in
    # the S0-003 guard's allow-list on purpose, so the step names it explicitly
    # via DATABASE_TARGET_CONFIRM rather than the guard being bypassed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saroh_migrate_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma: "false"

      - name: Replay migrations and check for drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_migrate_check
          DATABASE_TARGET_CONFIRM: saroh_migrate_check
        run: pnpm --filter @saroh/database db:verify:replay
  # Browser tests against a running, seeded stack.
  #
  # This is the harness the cross-product UX epic kept deferring to. Browser
  # verification is the recurring remaining step on #121, #122 and #125; #50
  # asks for cross-subdomain cookie, redirect, logout and CSRF coverage; and
  # B6 records the Playwright auth E2E as "manual-verified only". None of it
  # could move because nothing here ever started the apps together.
  #
  # Everything it asserts needs a real browser: whether a cookie set by one
  # origin is sent by another, whether a layout overflows at 320px, whether two
  # controls occupy the same pixels, whether a touch pointer gets a 44px
  # target. A test without a layout engine can answer none of those.
  #
  # Bare ports here, not the `.localhost` hostnames a developer uses: there is
  # no portless proxy on a runner, so the URLs are passed in explicitly and the
  # trusted-origin list is set to match. That list is exactly why the local
  # names exist — see docs/architecture/LOCAL_DEV.md.
  # Split four ways by spec file, each shard with its own Postgres and its
  # own freshly seeded stack, so the specs still run one at a time against
  # data only they touch (the config keeps workers: 1). About 11 minutes of
  # tests become 2.2 to 3.5 per shard.
  #
  # This is the longest job, so it sets the run's wall clock. Two things that
  # look faster and are not (measured 2026-09-29):
  #   - building once in a job the shards `need` and passing them the build:
  #     the apps here are built with THIS job's env (NEXT_PUBLIC_ROOT_DOMAIN
  #     is `localhost`, not `saroh.app`), so the Build job's output cannot be
  #     reused, and a separate build job in front of the shards puts ~3 min of
  #     setup and build in series with ~5 min of tests;
  #   - more shards: a run already starts 19 jobs at once, and a second run
  #     at the same time (a push to development and its PR) queued jobs by up
  #     to 6 minutes on the account's concurrent-job limit.
  browser-e2e-shard:
    name: Browser E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saroh_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saroh_e2e_test
      DATABASE_TARGET_CONFIRM: saroh_e2e_test
      # Explicit, and load-bearing. `SKIP_ENV_VALIDATION` makes the API's typed
      # env module return `process.env` untouched, which bypasses the SCHEMA
      # DEFAULTS as well as the validation — so `env.PORT` is undefined here and
      # Nest binds a random port. It only looks fine locally because
      # `apps/api.saroh.in/.env` sets PORT and a runner has no .env at all.
      PORT: 3333
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters # gitleaks:allow (CI placeholder, no live service)
      BETTER_AUTH_URL: http://localhost:3333
      # The redirect-after-sign-in check (#222) fails without this: the trusted
      # list defaults to the *.saroh.in production origins, so a return-to on
      # localhost is correctly refused and the visitor lands on the launcher.
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3003,http://localhost:3333
      APP_URL: http://localhost:3003
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3000
      # Where accounts sends a new account (onboarding); unset, the production
      # build falls back to https://app.saroh.in.
      NEXT_PUBLIC_APP_URL: http://localhost:3003
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3333
      NEXT_PUBLIC_APP_DOMAIN: app.saroh.in
      # `localhost`, not `saroh.app`: this is the renderer's OWN apex, and on a
      # runner that is what it is reached at. Told `saroh.app`, the middleware
      # reads `localhost` as a tenant subdomain and rewrites every request —
      # `/preview/<token>` included — into a tenant lookup that finds nothing.
      NEXT_PUBLIC_ROOT_DOMAIN: localhost
      EMAIL_FROM: Saroh <noreply@saroh.in>
      E2E_APP_URL: http://localhost:3003
      E2E_ACCOUNTS_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3333
      # The renderer, where a draft preview is served. As an ORIGIN, because
      # the app builds a preview address from NEXT_PUBLIC_ROOT_DOMAIN as
      # `https://saroh.app/...` — right in production, and unreachable here.
      # The site-review flow takes the token out of that address and opens it
      # against this origin instead.
      E2E_RENDERER_URL: http://localhost:3005
      # The marketing site, saroh.in (`web`), for marketing.spec.ts (plan U29).
      E2E_WEB_URL: http://localhost:3002
      # The API's links to the renderer (pay links, DEC-069 L6): this
      # stack's, not production's saroh.app, which a pay page opened on a
      # tenant host would otherwise redirect to.
      RENDERER_URL: http://localhost:3005
      # Site sign-in (round-2 A9): every booking page asks for an emailed
      # code at the last step. The built apps have no development fallback
      # for the relay and code secrets, so the stack gets throwaway ones (the
      # relay one is also what the sign-in spec signs its API calls with).
      # With no SMTP, the fake code transport leaves each code where the
      # browser tests read it (`e2e/tests/site-codes.ts`); it never runs in
      # production.
      SITE_RELAY_SECRET: saroh-dev-insecure-site-relay-secret-not-for-production
      SITE_ACCOUNTS_CODE_SECRET: ci-placeholder-site-code-secret-at-least-32-chars
      SITE_CODES_EMAIL_FAKE: log
      # Every real environment has a payments key, and sending an invoice
      # seals its pay link with it (D17): without one, Send answered 500 on
      # this stack. The same throwaway key the API specs use; it opens
      # nothing — the seeded connections are fakes.
      PAYMENTS_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow (test key, as in the API specs)

    steps:
      - uses: actions/checkout@v4
      # The Turbo cache lets an unchanged app's build replay instead of
      # rebuilding in every shard.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: e2e
          next-cache: "true"
          playwright: "true"

      # The migrated and seeded database, cached as a `pg_dump -Fc` and
      # restored in ~2s instead of ~40s of migrate and seed. Keyed on what the
      # seeded data depends on — the migrations and schema, the seed and what
      # it imports (the block contract, better-auth's hasher via the lockfile)
      # — and on the time: the showcase lays its diary out relative to the
      # moment it runs, so a dump is reused within one four-hour window of an
      # Indian day and never after. No restore-keys: a near match is a stale
      # database. On a miss the shards migrate and seed as before (below) and
      # one of them saves the dump. `scripts/prepush.sh --e2e` does the same
      # locally with a template database.
      #
      # pg_dump and pg_restore run inside the service container, so their
      # version is the server's, whatever the runner image ships.
      - name: Key the seeded database
        id: seed-key
        run: |
          hour=$(TZ=Asia/Kolkata date +%-H)
          echo "window=$(TZ=Asia/Kolkata date +%F)-$(( hour / 4 ))" >> "$GITHUB_OUTPUT"
      - name: Restore the seeded database dump
        id: seed-dump
        uses: actions/cache/restore@v4
        with:
          path: /tmp/e2e-seed.dump
          key: e2e-seed-v1-${{ steps.seed-key.outputs.window }}-${{ hashFiles('packages/database/prisma/**', 'packages/database/src/**', 'packages/database/package.json', 'packages/block-contract/src/**', 'pnpm-lock.yaml') }}
      - name: Load the seeded database from the dump
        if: steps.seed-dump.outputs.cache-hit == 'true'
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          pg_restore -U postgres -d saroh_e2e_test --no-owner --exit-on-error
          < /tmp/e2e-seed.dump

      # Migrations, not `db push`: this stack is the one place CI exercises the
      # app end to end, so it is built the way a real environment is.
      - name: Apply migrations
        if: steps.seed-dump.outputs.cache-hit != 'true'
        run: pnpm --filter @saroh/database db:migrate:deploy

      # The seed and the build in ONE turbo run, so they overlap: the seed
      # (~40s) used to finish before the build (~15s replayed, ~110s cold)
      # started. Turbo still orders what must be ordered:
      #   - the seed validates every section it writes through the block
      #     contract, which lives in a built package (#252), so it waits for
      #     its dependencies' builds (`^build`) — a direct `pnpm --filter`
      #     call resolved @saroh/block-contract to a dist nobody had made yet;
      #   - it also waits for @saroh/database's OWN build (turbo.json), whose
      #     `prisma generate` rewrites the client the seed is running on.
      #     Everything after that (api, accounts, app, renderer) only reads it.
      # Nothing here reads the database while building, so the seed's writes
      # cannot change a build.
      #
      # The SHOWCASE, not the base seed alone. The bookings, subscriptions,
      # order, customer and product-editor specs are set in Pulse Fitness,
      # Rye & Co. and Leela & Loom (`seed_sc_*`) and sign in as their staff
      # (Nisha, Rye's Member); none of that exists after `db:seed`, so those
      # specs failed on a 404 or a sign-in that never landed. The showcase runs
      # the base seed first, so Northwind is still there for everything else.
      - name: Seed the demo Organizations (showcase) and build the apps under test
        if: steps.seed-dump.outputs.cache-hit != 'true'
        run: >-
          pnpm turbo run db:seed:showcase build --log-order=grouped
          --filter=@saroh/database --filter=@saroh/api --filter=auth
          --filter=application --filter=sites --filter=web
      - name: Build the apps under test (the database came from the dump)
        if: steps.seed-dump.outputs.cache-hit == 'true'
        run: >-
          pnpm turbo run build --log-order=grouped
          --filter=@saroh/database --filter=@saroh/api --filter=auth
          --filter=application --filter=sites --filter=web
      # Before the stack starts: the specs write to it.
      - name: Dump the seeded database for the next run
        if: steps.seed-dump.outputs.cache-hit != 'true'
        run: >-
          docker exec ${{ job.services.postgres.id }}
          pg_dump -U postgres -Fc saroh_e2e_test > /tmp/e2e-seed.dump
      # Four shards miss together; the first to finish saves, and the others'
      # "cache already exists" is not a failure.
      - name: Save the seeded database dump
        if: steps.seed-dump.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/e2e-seed.dump
          key: ${{ steps.seed-dump.outputs.cache-primary-key }}

      # Started detached and polled, rather than trusting a fixed sleep: a cold
      # Next server on a runner is not reliably up in any particular number of
      # seconds, and a flaky harness gets ignored, which is worse than none.
      - name: Start the stack
        run: |
          set -euo pipefail
          pnpm --filter @saroh/api start > /tmp/api.log 2>&1 &
          pnpm --filter auth exec next start -p 3000 > /tmp/accounts.log 2>&1 &
          pnpm --filter application exec next start -p 3003 > /tmp/app.log 2>&1 &
          # The renderer: a shared preview link is served by THIS app, on the
          # renderer's own origin, and the not-live bar is its markup.
          pnpm --filter sites exec next start -p 3005 > /tmp/renderer.log 2>&1 &
          # The marketing site: its waitlist forwards to this stack's API.
          API_URL=http://localhost:3333 pnpm --filter web exec next start -p 3002 > /tmp/web.log 2>&1 &

          wait_for() {
            name="$1"
            url="$2"
            # Which statuses count as "serving", space separated. 307 is the
            # workspace bouncing an anonymous visitor to sign in; 404 is the
            # renderer answering for a token that does not exist. Both mean the
            # server is up, which is the only thing being asked here.
            #
            # Compared one at a time rather than as a `case` pattern: `|` is
            # case SYNTAX, parsed before the variable expands, so a pattern
            # built from a variable would never have matched anything.
            accept="${3:-200 307}"
            for attempt in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
              for want in $accept; do
                if [ "$code" = "$want" ]; then
                  echo "$name is up ($code)"
                  return 0
                fi
              done
              sleep 2
            done
            echo "::error::$name never came up (last status ${code})"
            return 1
          }

          # On a failed start the servers' logs go up as an artifact (below)
          # rather than into this public build log.
          # The renderer serves tenants by hostname and a runner has none, so
          # it is polled on a preview token instead; a 404 there is the app
          # answering, which is what "up" means for it.
          wait_for api http://localhost:3333/health
          wait_for accounts http://localhost:3000/login
          wait_for app http://localhost:3003/
          wait_for renderer http://localhost:3005/preview/not-a-token '200 307 404'
          wait_for web http://localhost:3002/ '200'

      - name: Upload the servers' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-shard-${{ matrix.shard }}
          path: /tmp/*.log
          retention-days: 3

      # e2e/run.mjs: sign in once, then desk and phone fullyParallel — so a
      # shard is a quarter of the TESTS, not of the files, and the four come
      # out even — then this shard's `@serial` tests one at a time. Two
      # workers: the stack under test shares the runner's two vCPUs.
      - name: Run browser tests
        env:
          PW_WORKERS: "2"
        run: pnpm --filter @saroh/e2e test:e2e --shard=${{ matrix.shard }}/4

      # The trace and screenshots are the whole point of a failed browser run:
      # without them a red build says "something looked wrong" and nothing else.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
  # The old check's name, passing only when every shard passed.
  browser-e2e:
    name: Browser E2E (seeded stack)
    runs-on: ubuntu-latest
    needs: [changes, browser-e2e-shard]
    if: always()
    steps:
      - name: Every shard that ran passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.browser-e2e-shard.result }}
        run: |
          [ "$CHANGES" = "success" ] || exit 1
          case "$SHARDS" in success|skipped) ;; *) exit 1 ;; esac

  # The permission-denied states, rendered by a PRODUCTION build (#287).
  #
  # It existed and never ran. `e2e/permissions.config.ts` and its suite shipped
  # with #274, CI ran only `test:e2e`, and the day #275 replaced the read-only
  # site view the suite went stale with nothing to say so. Tests that exist and
  # are invisible are worse than tests that do not exist: they read as coverage.
  #
  # Separate from the seeded browser job because it needs neither a database
  # nor a real sign-in. A ~100-line fake API answers per role, and the app is
  # built and served for real — `next dev` keeps the error messages production
  # redacts, and redaction is exactly what these tests are about.
  permissions-e2e:
    name: Permission states (production build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'

    env:
      # Bare ports: a runner has no portless, so the config's `.localhost`
      # hostnames would resolve to nothing. Setting these switches both the
      # URLs under test and how the two servers are started.
      PERMISSIONS_APP_URL: http://localhost:3004
      PERMISSIONS_API_URL: http://localhost:3334

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma: "false"
          playwright: "true"

      # Playwright's own webServer builds and starts both servers, and tears
      # them down afterwards — there is no stack to poll for here.
      - name: Run the permission suite
        run: pnpm --filter @saroh/e2e test:permissions

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: permissions-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  # Secret scanning runs as its own job over the full git history so a secret
  # committed in an earlier commit is still caught.
  #
  # This invokes the gitleaks CLI directly rather than gitleaks-action. The
  # action refuses to run for a GitHub *organization* without a paid
  # GITLEAKS_LICENSE — it exits non-zero before scanning anything, so the job
  # was failing on licensing rather than on any finding. The CLI it wraps is
  # MIT-licensed with no such gate, and the full-history scan is one flag.
  #
  # Version and checksum are pinned: this step is what would catch a leaked
  # credential, so it must not silently become a different binary, and a new
  # upstream rule must not turn the pipeline red without a commit that says so.
  # Reviewed false positives live in .gitleaksignore, keyed by fingerprint.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          gitleaks version

      # --redact so a genuine hit is reported as a location to go fix, without
      # reprinting the secret into a public build log.
      - name: Run gitleaks
        run: gitleaks git . --redact --no-banner --exit-code 1
