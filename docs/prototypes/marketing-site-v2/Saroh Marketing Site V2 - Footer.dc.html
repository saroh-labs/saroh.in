  renderVals() {
    return { features: [["Dashboard", "Dashboard"], ["Products"], ["Orders"], ["Customers"], ["Bookings"], ["Subscriptions"], ["Billing"], ["Insights"]].map(([name, file]) => ({ name, href: "Saroh Marketing Site V2 - Features - " + (file || name) + ".dc.html" })) };
