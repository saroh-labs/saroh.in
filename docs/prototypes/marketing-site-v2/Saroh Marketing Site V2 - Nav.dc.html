<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet"></helmet>
<nav ref="{{ navRef }}" aria-label="Main" style="position: relative; z-index: 30; display: flex; align-items: center; gap: 24px; padding: 20px clamp(16px, 4vw, 56px); border-bottom: 1px solid #D9D6CC; background: #F5F2EC; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif">
  <a href="Saroh Marketing Site V2 - Home.dc.html" aria-label="Saroh home" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.025em; display: flex; align-items: center; gap: 8px; color: #1C1C1A; text-decoration: none; border-radius: 8px" style-focus="outline: 2px solid #D98A15; outline-offset: 3px"><svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M44 11 L27 26 L40 37 L20 53" stroke="#1C1C1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><circle cx="50" cy="48" r="5.6" fill="#D98A15"></circle></svg>Saroh</a>

  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 4px; font-size: 14.5px; align-items: center">
      <div style="position: relative">
        <button type="button" aria-expanded="{{ featOpenS }}" aria-haspopup="true" onClick="{{ toggleFeat }}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 9px; border: none; background: transparent; font: inherit; color: #1C1C1A; cursor: pointer; text-decoration: {{ featLine }}; text-decoration-color: #D98A15; text-decoration-thickness: 2px; text-underline-offset: 8px" style-hover="background: #EBE7DE" style-focus="outline: 2px solid #D98A15; outline-offset: 1px">Features<span aria-hidden="true" style="font-size: 10px">▾</span></button>
        <sc-if value="{{ featOpen }}" hint-placeholder-val="{{ false }}">
          <div role="menu" aria-label="Features" onKeyDown="{{ menuKeys }}" style="position: absolute; top: calc(100% + 10px); left: 0; width: 640px; background: #FFFFFF; border: 1px solid #D9D6CC; border-radius: 16px; box-shadow: 0 24px 60px rgba(28,28,26,0.16); padding: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
            <sc-for list="{{ features }}" as="f" hint-placeholder-count="8">
              <a role="menuitem" href="{{ f.href }}" aria-current="{{ f.cur }}" style="display: grid; gap: 3px; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: #1C1C1A" style-hover="background: #F5F2EC" style-focus="outline: 2px solid #D98A15; outline-offset: -2px; background: #F5F2EC"><span style="font-weight: 600; font-size: 15px">{{ f.name }}</span><span style="font-size: 13.5px; line-height: 1.45; color: #6B665A">{{ f.line }}</span></a>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="position: relative">
        <button type="button" aria-expanded="{{ solOpenS }}" aria-haspopup="true" onClick="{{ toggleSol }}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 9px; border: none; background: transparent; font: inherit; color: #1C1C1A; cursor: pointer; text-decoration: {{ solLine }}; text-decoration-color: #D98A15; text-decoration-thickness: 2px; text-underline-offset: 8px" style-hover="background: #EBE7DE" style-focus="outline: 2px solid #D98A15; outline-offset: 1px">Solutions<span aria-hidden="true" style="font-size: 10px">▾</span></button>
        <sc-if value="{{ solOpen }}" hint-placeholder-val="{{ false }}">
          <div role="menu" aria-label="Solutions" onKeyDown="{{ menuKeys }}" style="position: absolute; top: calc(100% + 10px); left: 0; width: 340px; background: #FFFFFF; border: 1px solid #D9D6CC; border-radius: 16px; box-shadow: 0 24px 60px rgba(28,28,26,0.16); padding: 10px; display: grid; gap: 2px">
            <sc-for list="{{ solutions }}" as="f" hint-placeholder-count="3">
              <a role="menuitem" href="{{ f.href }}" aria-current="{{ f.cur }}" style="display: grid; gap: 3px; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: #1C1C1A" style-hover="background: #F5F2EC" style-focus="outline: 2px solid #D98A15; outline-offset: -2px; background: #F5F2EC"><span style="font-weight: 600; font-size: 15px">{{ f.name }}</span><span style="font-size: 13.5px; line-height: 1.45; color: #6B665A">{{ f.line }}</span></a>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <a href="Saroh Marketing Site V2 - Pricing.dc.html" aria-current="{{ priceCur }}" style="height: 36px; padding: 0 12px; display: flex; align-items: center; color: #1C1C1A; text-decoration: {{ priceLine }}; text-decoration-color: #D98A15; text-decoration-thickness: 2px; text-underline-offset: 8px; border-radius: 9px" style-hover="background: #EBE7DE" style-focus="outline: 2px solid #D98A15; outline-offset: 1px">Pricing</a>
    </div>
    <a href="Saroh Auth C Split.dc.html#login" style="margin-left: auto; font-size: 14.5px; color: #1C1C1A; text-decoration: none; height: 36px; padding: 0 12px; display: flex; align-items: center; border-radius: 9px" style-hover="background: #EBE7DE" style-focus="outline: 2px solid #D98A15; outline-offset: 1px">Sign in</a>
    <a href="Saroh Auth C Split.dc.html#signup" style="height: 40px; padding: 0 18px; border-radius: 10px; background: #1C1C1A; color: #F5F2EC; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; text-decoration: none" style-hover="background: #3A3833; color: #F5F2EC" style-active="transform: scale(0.97)" style-focus="outline: 2px solid #D98A15; outline-offset: 2px">Start free</a>
  </sc-if>

  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <a href="Saroh Auth C Split.dc.html#signup" style="margin-left: auto; height: 40px; padding: 0 16px; border-radius: 10px; background: #1C1C1A; color: #F5F2EC; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; text-decoration: none" style-focus="outline: 2px solid #D98A15; outline-offset: 2px">Start free</a>
    <button type="button" aria-expanded="{{ sheetOpenS }}" aria-label="Menu" onClick="{{ toggleSheet }}" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #BCB8AC; background: transparent; display: grid; place-items: center; cursor: pointer; font: inherit; color: #1C1C1A" style-focus="outline: 2px solid #D98A15; outline-offset: 2px"><span aria-hidden="true" style="display: grid; gap: 4px"><span style="display: block; width: 18px; height: 2px; background: #1C1C1A; border-radius: 2px"></span><span style="display: block; width: 18px; height: 2px; background: #1C1C1A; border-radius: 2px"></span><span style="display: block; width: 18px; height: 2px; background: #1C1C1A; border-radius: 2px"></span></span></button>
  </sc-if>
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 50; background: #F5F2EC; overflow-y: auto; display: grid; align-content: start; gap: 8px; padding: 20px clamp(16px, 4vw, 56px) 32px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #D9D6CC"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.025em">Menu</span><button type="button" onClick="{{ toggleSheet }}" aria-label="Close menu" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #BCB8AC; background: transparent; font-size: 20px; cursor: pointer; color: #1C1C1A" style-focus="outline: 2px solid #D98A15; outline-offset: 2px">×</button></div>
      <button type="button" aria-expanded="{{ mFeatS }}" onClick="{{ toggleMFeat }}" style="display: flex; justify-content: space-between; align-items: center; height: 52px; border: none; background: transparent; font: inherit; font-size: 18px; font-weight: 600; color: #1C1C1A; padding: 0; cursor: pointer">Features<span aria-hidden="true" style="font-size: 12px">{{ mFeatArrow }}</span></button>
      <sc-if value="{{ mFeat }}" hint-placeholder-val="{{ false }}"><div style="display: grid; gap: 2px; padding-bottom: 8px"><sc-for list="{{ features }}" as="f" hint-placeholder-count="8"><a href="{{ f.href }}" aria-current="{{ f.cur }}" style="display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; color: #1C1C1A; text-decoration: none; background: #FFFFFF; border: 1px solid #E4E0D6"><span style="font-weight: 600; font-size: 15.5px">{{ f.name }}</span><span style="font-size: 13.5px; color: #6B665A">{{ f.line }}</span></a></sc-for></div></sc-if>
      <button type="button" aria-expanded="{{ mSolS }}" onClick="{{ toggleMSol }}" style="display: flex; justify-content: space-between; align-items: center; height: 52px; border: none; border-top: 1px solid #D9D6CC; background: transparent; font: inherit; font-size: 18px; font-weight: 600; color: #1C1C1A; padding: 0; cursor: pointer">Solutions<span aria-hidden="true" style="font-size: 12px">{{ mSolArrow }}</span></button>
      <sc-if value="{{ mSol }}" hint-placeholder-val="{{ false }}"><div style="display: grid; gap: 2px; padding-bottom: 8px"><sc-for list="{{ solutions }}" as="f" hint-placeholder-count="3"><a href="{{ f.href }}" aria-current="{{ f.cur }}" style="display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; color: #1C1C1A; text-decoration: none; background: #FFFFFF; border: 1px solid #E4E0D6"><span style="font-weight: 600; font-size: 15.5px">{{ f.name }}</span><span style="font-size: 13.5px; color: #6B665A">{{ f.line }}</span></a></sc-for></div></sc-if>
      <a href="Saroh Marketing Site V2 - Pricing.dc.html" onClick="{{ closeAll }}" style="display: flex; align-items: center; height: 52px; border-top: 1px solid #D9D6CC; font-size: 18px; font-weight: 600; color: #1C1C1A; text-decoration: none">Pricing</a>
      <a href="Saroh Auth C Split.dc.html#login" style="display: flex; align-items: center; height: 52px; border-top: 1px solid #D9D6CC; font-size: 18px; font-weight: 600; color: #1C1C1A; text-decoration: none">Sign in</a>
      <a href="Saroh Auth C Split.dc.html#signup" style="margin-top: 12px; height: 52px; border-radius: 12px; background: #1C1C1A; color: #F5F2EC; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Start free</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 480}, &quot;current&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
const FEATURES = [
  ["Dashboard", "What needs you today, for each person", "Saroh Marketing Site V2 - Features - Dashboard.dc.html"],
  ["Products", "Prices, sizes, photos and stock, shared everywhere", "Saroh Marketing Site V2 - Features - Products.dc.html"],
  ["Orders", "Every order in one list, late ones flagged", "Saroh Marketing Site V2 - Features - Orders.dc.html"],
  ["Customers", "Orders, bookings, bills and notes on one page", "Saroh Marketing Site V2 - Features - Customers.dc.html"],
  ["Bookings", "Classes, sessions and appointments", "Saroh Marketing Site V2 - Features - Bookings.dc.html"],
  ["Subscriptions", "Plans that renew themselves", "Saroh Marketing Site V2 - Features - Subscriptions.dc.html"],
  ["Billing", "Invoices and receipts made for you", "Saroh Marketing Site V2 - Features - Billing.dc.html"],
  ["Insights", "How the week went, against the weeks before", "Saroh Marketing Site V2 - Features - Insights.dc.html"]
];
const SOLUTIONS = [
  ["Shops", "Sell at the counter and online", "Saroh Marketing Site V2 - Solutions - Shops.dc.html"],
  ["Gyms & studios", "Classes, memberships and class packs", "Saroh Marketing Site V2 - Solutions - Gyms.dc.html"],
  ["Clinics", "Appointments, treatments and patient notes", "Saroh Marketing Site V2 - Solutions - Clinics.dc.html"]
];
class Component extends DCLogic {
  state = { open: null, narrow: false, sheet: false, mFeat: null, mSol: null };
  navRef = React.createRef();
  componentDidMount() {
    this._off = e => { if (this.state.open && this.navRef.current && !this.navRef.current.contains(e.target)) this.setState({ open: null }); };
    this._esc = e => { if (e.key === "Escape" && (this.state.open || this.state.sheet)) { const was = this.state.open; this.setState({ open: null, sheet: false }); if (was && this.navRef.current) { const b = this.navRef.current.querySelectorAll("button[aria-haspopup]")[was === "f" ? 0 : 1]; if (b) b.focus(); } } };
    this._rs = () => { const n = window.innerWidth < 760; if (n !== this.state.narrow) this.setState({ narrow: n, open: null, sheet: n ? this.state.sheet : false }); };
    document.addEventListener("click", this._off); document.addEventListener("keydown", this._esc); window.addEventListener("resize", this._rs); this._rs();
  }
  componentDidUpdate(pp, ps) {
    if (this.state.open && this.state.open !== ps.open && this.navRef.current) { const a = this.navRef.current.querySelector("[role=menu] a"); if (a) a.focus(); }
  }
  componentWillUnmount() { document.removeEventListener("click", this._off); document.removeEventListener("keydown", this._esc); window.removeEventListener("resize", this._rs); }
  renderVals() {
    const s = this.state, o = s.open, cur = this.props.current || "";
    const mk = ([name, line, href]) => ({ name, line, href, cur: name === cur ? "page" : undefined });
    const inF = FEATURES.some(f => f[0] === cur), inS = SOLUTIONS.some(f => f[0] === cur);
    return {
      navRef: this.navRef, wide: !s.narrow, narrow: s.narrow,
      featOpen: o === "f", solOpen: o === "s", featOpenS: o === "f" ? "true" : "false", solOpenS: o === "s" ? "true" : "false",
      featLine: inF ? "underline" : "none", solLine: inS ? "underline" : "none", priceLine: cur === "Pricing" ? "underline" : "none", priceCur: cur === "Pricing" ? "page" : undefined,
      toggleFeat: () => this.setState({ open: o === "f" ? null : "f" }), toggleSol: () => this.setState({ open: o === "s" ? null : "s" }),
      menuKeys: e => {
        if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault(); const items = Array.from(e.currentTarget.querySelectorAll("a")), i = items.indexOf(document.activeElement);
        const step = e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1; const n = items[(i + step + items.length) % items.length]; if (n) n.focus();
      },
      sheetOpen: s.sheet, sheetOpenS: s.sheet ? "true" : "false", toggleSheet: () => this.setState({ sheet: !s.sheet }), closeAll: () => this.setState({ sheet: false }),
      ...(() => { const mf = s.mFeat == null ? inF : s.mFeat, ms = s.mSol == null ? inS : s.mSol; return {
        mFeat: mf, mSol: ms, mFeatS: mf ? "true" : "false", mSolS: ms ? "true" : "false", mFeatArrow: mf ? "▴" : "▾", mSolArrow: ms ? "▴" : "▾",
        toggleMFeat: () => this.setState({ mFeat: !mf }), toggleMSol: () => this.setState({ mSol: !ms }) }; })(),
      features: FEATURES.map(mk), solutions: SOLUTIONS.map(mk)
    };
  }
}
</script>
</body>
</html>
