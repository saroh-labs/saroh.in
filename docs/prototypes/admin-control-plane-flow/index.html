<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Saroh Admin — Control Plane Flow Preview</title>
        <style>
            :root {
                --paper: #f4f1e9;
                --paper-strong: #fbfaf5;
                --ink: #17202b;
                --ink-soft: #5c6570;
                --line: #d8d3c8;
                --line-strong: #bbb4a5;
                --blue: #174ea6;
                --blue-pale: #e7eef9;
                --amber: #c87500;
                --amber-pale: #fff2d8;
                --red: #af2e24;
                --red-pale: #fbe7e4;
                --green: #176842;
                --green-pale: #e5f2e9;
                --nav: #111923;
                --nav-muted: #9da7b2;
                --radius: 10px;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                color: var(--ink);
                background:
                    linear-gradient(
                        rgba(23, 32, 43, 0.025) 1px,
                        transparent 1px
                    ),
                    var(--paper);
                background-size: 100% 28px;
                font-family:
                    "Avenir Next", "Segoe UI", Helvetica, sans-serif;
                font-size: 14px;
            }

            button,
            input {
                font: inherit;
            }

            button {
                color: inherit;
            }

            .prototype-notice {
                position: fixed;
                z-index: 20;
                top: 0;
                right: 0;
                left: 0;
                height: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #684300;
                border-bottom: 1px solid #e7c87b;
                background: #fff3c8;
                font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .app {
                min-height: 100vh;
                padding-top: 28px;
                display: grid;
                grid-template-columns: 236px minmax(0, 1fr);
            }

            .sidebar {
                position: fixed;
                top: 28px;
                bottom: 0;
                left: 0;
                width: 236px;
                display: flex;
                flex-direction: column;
                color: white;
                background:
                    radial-gradient(
                        circle at 20% -10%,
                        rgba(48, 105, 187, 0.32),
                        transparent 34%
                    ),
                    var(--nav);
                border-right: 1px solid #2a3541;
            }

            .brand {
                height: 76px;
                padding: 0 22px;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 1px solid #2a3541;
            }

            .brand-mark {
                width: 30px;
                height: 30px;
                display: grid;
                place-items: center;
                color: var(--nav);
                background: #edf4ff;
                border-radius: 50%;
                font: 800 14px/1 Georgia, serif;
            }

            .brand-name {
                font: 700 18px/1 Georgia, serif;
            }

            .brand-name span {
                margin-left: 3px;
                color: var(--nav-muted);
                font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .nav-section {
                padding: 18px 12px 0;
            }

            .nav-label {
                padding: 0 10px 8px;
                color: #6f7b88;
                font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .nav-item {
                width: 100%;
                height: 42px;
                padding: 0 11px;
                display: flex;
                align-items: center;
                gap: 11px;
                color: #b7c0c9;
                border: 0;
                border-radius: 7px;
                background: transparent;
                cursor: pointer;
                text-align: left;
            }

            .nav-item:hover {
                color: white;
                background: rgba(255, 255, 255, 0.06);
            }

            .nav-item.active {
                color: white;
                background: #1d5cab;
                box-shadow: inset 3px 0 #a9cfff;
            }

            .nav-icon {
                width: 18px;
                color: currentColor;
                font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-align: center;
            }

            .nav-count {
                margin-left: auto;
                min-width: 21px;
                padding: 2px 6px;
                color: #0c1722;
                background: #f2c96d;
                border-radius: 999px;
                font: 800 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-align: center;
            }

            .sidebar-user {
                margin-top: auto;
                padding: 15px 18px;
                display: grid;
                grid-template-columns: 32px 1fr;
                gap: 10px;
                border-top: 1px solid #2a3541;
            }

            .avatar {
                width: 32px;
                height: 32px;
                display: grid;
                place-items: center;
                color: #173c6e;
                background: #dceaff;
                border-radius: 50%;
                font: 800 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .user-name {
                overflow: hidden;
                font-size: 12px;
                font-weight: 700;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .user-role {
                margin-top: 3px;
                color: #7f8c99;
                font: 600 9px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-transform: uppercase;
            }

            .content {
                grid-column: 2;
                min-width: 0;
            }

            .topbar {
                position: sticky;
                z-index: 10;
                top: 28px;
                height: 64px;
                padding: 0 28px;
                display: flex;
                align-items: center;
                gap: 18px;
                background: rgba(251, 250, 245, 0.94);
                border-bottom: 1px solid var(--line);
                backdrop-filter: blur(12px);
            }

            .breadcrumb {
                min-width: 180px;
                color: var(--ink-soft);
                font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .breadcrumb strong {
                color: var(--ink);
            }

            .search {
                position: relative;
                max-width: 500px;
                flex: 1;
            }

            .search input {
                width: 100%;
                height: 38px;
                padding: 0 92px 0 36px;
                color: var(--ink);
                border: 1px solid var(--line);
                border-radius: 7px;
                outline: none;
                background: white;
            }

            .search input:focus {
                border-color: var(--blue);
                box-shadow: 0 0 0 3px rgba(23, 78, 166, 0.12);
            }

            .search::before {
                position: absolute;
                top: 11px;
                left: 13px;
                color: var(--ink-soft);
                content: "⌕";
                font-size: 18px;
            }

            .shortcut {
                position: absolute;
                top: 9px;
                right: 10px;
                padding: 4px 7px;
                color: var(--ink-soft);
                border: 1px solid var(--line);
                border-radius: 4px;
                background: #f8f7f2;
                font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .top-status {
                margin-left: auto;
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--green);
                font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-transform: uppercase;
            }

            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: currentColor;
                box-shadow: 0 0 0 4px currentColor;
                opacity: 0.78;
            }

            main {
                max-width: 1480px;
                padding: 30px 32px 56px;
            }

            .page-head {
                margin-bottom: 24px;
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 28px;
            }

            .eyebrow {
                margin-bottom: 8px;
                color: var(--blue);
                font: 800 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.13em;
                text-transform: uppercase;
            }

            h1,
            h2,
            h3,
            p {
                margin-top: 0;
            }

            h1 {
                margin-bottom: 7px;
                font: 600 clamp(28px, 3vw, 42px) / 1.05 Georgia, serif;
                letter-spacing: -0.035em;
            }

            .page-subtitle {
                max-width: 670px;
                margin-bottom: 0;
                color: var(--ink-soft);
                line-height: 1.55;
            }

            .button-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 9px;
            }

            .button {
                min-height: 36px;
                padding: 0 14px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                border: 1px solid var(--line-strong);
                border-radius: 6px;
                background: var(--paper-strong);
                cursor: pointer;
                font-size: 12px;
                font-weight: 700;
            }

            .button:hover {
                border-color: var(--blue);
            }

            .button.primary {
                color: white;
                border-color: var(--blue);
                background: var(--blue);
            }

            .button.danger {
                color: var(--red);
                border-color: #dcaaa5;
                background: var(--red-pale);
            }

            .button.small {
                min-height: 30px;
                padding: 0 10px;
                font-size: 11px;
            }

            .metrics {
                margin-bottom: 20px;
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
            }

            .metric {
                position: relative;
                min-height: 128px;
                padding: 18px;
                overflow: hidden;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: rgba(251, 250, 245, 0.88);
                box-shadow: 0 4px 14px rgba(42, 45, 48, 0.035);
            }

            .metric::after {
                position: absolute;
                right: -25px;
                bottom: -35px;
                width: 110px;
                height: 110px;
                border: 1px solid var(--line);
                border-radius: 50%;
                content: "";
            }

            .metric-label {
                color: var(--ink-soft);
                font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .metric-value {
                margin: 11px 0 8px;
                font: 600 34px/1 Georgia, serif;
                letter-spacing: -0.04em;
            }

            .metric-foot {
                color: var(--ink-soft);
                font-size: 11px;
            }

            .trend-up {
                color: var(--green);
                font-weight: 800;
            }

            .trend-risk {
                color: var(--red);
                font-weight: 800;
            }

            .grid-2 {
                display: grid;
                grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.8fr);
                gap: 16px;
            }

            .grid-even {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }

            .panel {
                min-width: 0;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: rgba(251, 250, 245, 0.9);
                box-shadow: 0 4px 16px rgba(42, 45, 48, 0.035);
            }

            .panel-head {
                min-height: 60px;
                padding: 13px 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                border-bottom: 1px solid var(--line);
            }

            .panel-title {
                margin: 0;
                font: 700 14px/1.2 Georgia, serif;
            }

            .panel-kicker {
                margin-top: 4px;
                color: var(--ink-soft);
                font-size: 10px;
            }

            .panel-link {
                color: var(--blue);
                border: 0;
                background: none;
                cursor: pointer;
                font-size: 11px;
                font-weight: 700;
            }

            .panel-body {
                padding: 16px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th {
                height: 38px;
                padding: 0 12px;
                color: var(--ink-soft);
                border-bottom: 1px solid var(--line);
                font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                letter-spacing: 0.08em;
                text-align: left;
                text-transform: uppercase;
            }

            td {
                height: 50px;
                padding: 8px 12px;
                border-bottom: 1px solid #e7e3da;
                font-size: 12px;
                vertical-align: middle;
            }

            tr:last-child td {
                border-bottom: 0;
            }

            tbody tr[data-open] {
                cursor: pointer;
            }

            tbody tr[data-open]:hover {
                background: #f2f5f9;
            }

            .mono {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 10px;
            }

            .muted {
                color: var(--ink-soft);
            }

            .strong {
                font-weight: 750;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 4px 7px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: #f5f3ed;
                font: 750 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                white-space: nowrap;
                text-transform: uppercase;
            }

            .badge::before {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: currentColor;
                content: "";
            }

            .badge.good {
                color: var(--green);
                border-color: #bbd9c8;
                background: var(--green-pale);
            }

            .badge.warn {
                color: #8c5900;
                border-color: #e9cd90;
                background: var(--amber-pale);
            }

            .badge.bad {
                color: var(--red);
                border-color: #e4bbb6;
                background: var(--red-pale);
            }

            .badge.info {
                color: var(--blue);
                border-color: #bdcce5;
                background: var(--blue-pale);
            }

            .attention-list {
                display: grid;
                gap: 8px;
            }

            .attention {
                padding: 12px;
                display: grid;
                grid-template-columns: 31px 1fr auto;
                gap: 11px;
                align-items: center;
                border: 1px solid var(--line);
                border-radius: 7px;
                background: white;
            }

            .attention-mark {
                width: 31px;
                height: 31px;
                display: grid;
                place-items: center;
                color: #704600;
                background: var(--amber-pale);
                border-radius: 7px;
                font-weight: 900;
            }

            .attention-title {
                margin-bottom: 3px;
                font-size: 11px;
                font-weight: 750;
            }

            .attention-copy {
                color: var(--ink-soft);
                font-size: 10px;
            }

            .flow-strip {
                margin-bottom: 20px;
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                overflow: hidden;
                background: var(--paper-strong);
            }

            .flow-step {
                position: relative;
                min-height: 76px;
                padding: 14px 15px;
                border-right: 1px solid var(--line);
            }

            .flow-step:last-child {
                border-right: 0;
            }

            .flow-step:not(:last-child)::after {
                position: absolute;
                z-index: 2;
                top: 29px;
                right: -6px;
                width: 11px;
                height: 11px;
                background: var(--paper-strong);
                border-top: 1px solid var(--line);
                border-right: 1px solid var(--line);
                content: "";
                transform: rotate(45deg);
            }

            .flow-number {
                color: var(--blue);
                font: 800 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .flow-name {
                margin-top: 8px;
                font-size: 11px;
                font-weight: 750;
            }

            .flow-desc {
                margin-top: 3px;
                color: var(--ink-soft);
                font-size: 9px;
            }

            .filters {
                margin-bottom: 14px;
                padding: 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: rgba(251, 250, 245, 0.84);
            }

            .filter {
                height: 32px;
                padding: 0 10px;
                border: 1px solid var(--line);
                border-radius: 5px;
                background: white;
                font-size: 10px;
                font-weight: 650;
            }

            .filter.search-filter {
                min-width: 260px;
                flex: 1;
            }

            .target-head {
                margin: -30px -32px 24px;
                padding: 22px 32px 0;
                background: #edf1f6;
                border-bottom: 1px solid var(--line);
            }

            .target-top {
                padding-bottom: 18px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
            }

            .target-identity {
                display: flex;
                align-items: center;
                gap: 13px;
            }

            .org-logo {
                width: 42px;
                height: 42px;
                display: grid;
                place-items: center;
                color: white;
                background: #183a67;
                border-radius: 9px;
                font: 700 14px/1 Georgia, serif;
            }

            .target-name {
                margin-bottom: 4px;
                font: 700 20px/1 Georgia, serif;
            }

            .tabs {
                display: flex;
                gap: 24px;
                overflow-x: auto;
            }

            .tab {
                padding: 0 0 11px;
                color: var(--ink-soft);
                border: 0;
                border-bottom: 2px solid transparent;
                background: transparent;
                cursor: pointer;
                font-size: 11px;
                font-weight: 700;
                white-space: nowrap;
            }

            .tab.active {
                color: var(--blue);
                border-color: var(--blue);
            }

            .health-row {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .health-cell {
                padding: 12px;
                border: 1px solid var(--line);
                border-radius: 7px;
                background: white;
            }

            .health-label {
                color: var(--ink-soft);
                font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-transform: uppercase;
            }

            .health-value {
                margin-top: 8px;
                font-size: 12px;
                font-weight: 750;
            }

            .timeline {
                display: grid;
            }

            .event {
                position: relative;
                padding: 0 0 18px 25px;
            }

            .event::before {
                position: absolute;
                top: 5px;
                bottom: -5px;
                left: 6px;
                width: 1px;
                background: var(--line);
                content: "";
            }

            .event:last-child::before {
                display: none;
            }

            .event::after {
                position: absolute;
                top: 3px;
                left: 2px;
                width: 9px;
                height: 9px;
                border: 2px solid var(--paper-strong);
                border-radius: 50%;
                background: var(--blue);
                box-shadow: 0 0 0 1px var(--blue);
                content: "";
            }

            .event-title {
                margin-bottom: 4px;
                font-size: 11px;
                font-weight: 750;
            }

            .event-meta {
                color: var(--ink-soft);
                font: 500 9px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .role-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }

            .role-card {
                padding: 16px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: white;
            }

            .role-card.owner {
                color: white;
                border-color: #183a67;
                background: #183a67;
            }

            .role-card h3 {
                margin-bottom: 7px;
                font: 700 15px/1.2 Georgia, serif;
            }

            .role-card p {
                min-height: 34px;
                margin-bottom: 13px;
                color: var(--ink-soft);
                font-size: 10px;
                line-height: 1.5;
            }

            .role-card.owner p {
                color: #b9cbe0;
            }

            .role-stat {
                font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
                text-transform: uppercase;
            }

            .stage {
                position: relative;
                padding: 14px 14px 14px 44px;
                border-bottom: 1px solid var(--line);
            }

            .stage:last-child {
                border-bottom: 0;
            }

            .stage-number {
                position: absolute;
                top: 13px;
                left: 13px;
                width: 22px;
                height: 22px;
                display: grid;
                place-items: center;
                color: var(--ink-soft);
                border: 1px solid var(--line);
                border-radius: 50%;
                background: white;
                font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .stage.complete .stage-number {
                color: white;
                border-color: var(--green);
                background: var(--green);
            }

            .stage.current {
                background: var(--blue-pale);
            }

            .stage.current .stage-number {
                color: white;
                border-color: var(--blue);
                background: var(--blue);
            }

            .stage-name {
                font-size: 11px;
                font-weight: 750;
            }

            .stage-copy {
                margin-top: 4px;
                color: var(--ink-soft);
                font-size: 10px;
            }

            .risk-bar {
                height: 6px;
                overflow: hidden;
                border-radius: 99px;
                background: #e3dfd5;
            }

            .risk-bar span {
                display: block;
                height: 100%;
                border-radius: inherit;
                background: var(--blue);
            }

            .permission-matrix th,
            .permission-matrix td {
                text-align: center;
            }

            .permission-matrix th:first-child,
            .permission-matrix td:first-child {
                text-align: left;
            }

            .yes {
                color: var(--green);
                font-weight: 900;
            }

            .no {
                color: #b7afa3;
            }

            .toast {
                position: fixed;
                z-index: 40;
                right: 22px;
                bottom: 22px;
                max-width: 340px;
                padding: 13px 15px;
                display: none;
                color: white;
                border-radius: 7px;
                background: #182431;
                box-shadow: 0 16px 45px rgba(18, 27, 37, 0.28);
                font-size: 11px;
                line-height: 1.5;
            }

            .toast.show {
                display: block;
                animation: toast-in 180ms ease-out;
            }

            @keyframes toast-in {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
            }

            @media (max-width: 1040px) {
                .metrics {
                    grid-template-columns: repeat(2, 1fr);
                }

                .grid-2,
                .grid-even {
                    grid-template-columns: 1fr;
                }

                .role-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .flow-strip {
                    grid-template-columns: 1fr;
                }

                .flow-step {
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }

                .flow-step::after {

        <script>
            const titles = {
                dashboard: "Dashboard",
                organizations: "Organizations",
                organization: "Organizations / Northstar Fitness",
                operations: "Operations",
                releases: "Releases",
                team: "Team",
                audit: "Audit",
            };

            const main = document.getElementById("main");
            const crumb = document.getElementById("crumb");
            const toast = document.getElementById("toast");
            let toastTimer;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(
                    () => toast.classList.remove("show"),
                    3200,
                );
            }

            function render(screen) {
                const template = document.getElementById(screen);
                if (!template) return;
                main.replaceChildren(template.content.cloneNode(true));
                crumb.textContent = titles[screen];

                document.querySelectorAll(".nav-item").forEach((item) => {
                    const navScreen =
                        screen === "organization" ? "organizations" : screen;
                    item.classList.toggle(
                        "active",
                        item.dataset.screen === navScreen,
                    );
                });

                main.querySelectorAll("[data-go]").forEach((button) => {
                    button.addEventListener("click", () =>
                        render(button.dataset.go),
                    );
                });

                main.querySelectorAll("[data-open]").forEach((row) => {
                    row.addEventListener("click", () =>
                        render(row.dataset.open),
                    );
                });

                main.querySelectorAll("[data-toast]").forEach((button) => {
                    button.addEventListener("click", () =>
                        showToast(button.dataset.toast),
                    );
                });

                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            document.querySelectorAll(".nav-item").forEach((item) => {
                item.addEventListener("click", () => render(item.dataset.screen));
            });

            document.addEventListener("keydown", (event) => {
                if ((event.metaKey || event.ctrlKey) && event.key === "k") {
                    event.preventDefault();
                    document.querySelector(".search input").focus();
                }
            });

            render("dashboard");
        </script>
